# QA-NAME-01 banned names for packs derived from the reference-IP research
# (plan §2.1, design provenance-gate-design.md §5.7). Copy into
# games/<pack>/provenance/banned-names.yml.
# The original title is committed only inside hashedNames (never in plain text).
# The remaining terms/stems are plain on purpose (review readability, plan wording);
# original proper names are committed only as sha256-48 hashes, generated from
# a reviewed list kept under the gitignored .omo/ with:
#   lune run cli/forge provenance fingerprint --names <list> --salt reference-ip-names-v1
version: 1
terms:
  - Wild Lands
  - 야생의 땅
stems:
  - 개척
  - Pioneer
  - 워프
singleLetter:
  - K
  - X
hashedNames:
  algo: sha256-48
  salt: "reference-ip-names-v1"
  entries:
