# QA-NAME-01 banned names for packs derived from the Durango research
# (plan §2.1, design provenance-gate-design.md §5.7). Copy into
# games/<pack>/provenance/banned-names.yml.
# terms/stems are plain on purpose (review readability, plan wording);
# original proper names are committed only as sha256-48 hashes, generated from
# a reviewed list kept under the gitignored .omo/ with:
#   lune run cli/forge provenance fingerprint --names <list> --salt durango-names-v1
