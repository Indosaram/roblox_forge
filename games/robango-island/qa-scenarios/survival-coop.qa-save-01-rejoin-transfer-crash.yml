# QA-SAVE-01: rejoin + transfer crash on robango-island. The conserved item is starter-fiber:
# bag + in-flight transfer + warehouse always sums to the starting 12 across crash, reload and withdraw.
name: qa-save-01-rejoin-transfer-crash
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
timeout_seconds: 120
players: [owner]
fixtures: [cli/forge/fixtures/item-transfer-recovery]
data:
  durable:
    actions: ["survival-coop:transfer-deposit", "survival-coop:transfer-withdraw"]
    personal:
      namespace: transfer-personal
      inventoryPath: [genres, survival-coop, data, inventory, bag]
  settlement:
    key: transfer-tribe
    tribeId: tribe
    owner: owner
    slots: 20
    radiusStuds: 128
    positions: {owner: {x: 16, y: 0, z: 16}}
    items: []
steps:
  - {op: begin_clock}
  - {op: join, player: owner}
  # A deposit settles in its own command; fail the escrow write so the crash lands right after PREPARED.
  - {op: commit_barrier, mode: fail, count: 1, key: "transfer-personal:owner", skip: 2}
  - {op: command, player: owner, requestId: Transfer101, sessionEpoch: current, action: "survival-coop:transfer-deposit", args: [starter-fiber, 3], expect: refused}
  - {op: expect_result, player: owner, field: data.phase, equals: SOURCE_UNKNOWN}
  - {op: reload}
  - {op: advance_elapsed, seconds: 60}
  - {op: reload}
  - {op: advance_elapsed, seconds: 121}
  - {op: join, player: owner}
  - {op: recover_transfers, player: owner, maximum: 1}
  - {op: expect_snapshot, player: owner, genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 9}
  - {op: commit_barrier, mode: fail, count: 1}
  - {op: command, player: owner, requestId: Transfer101, sessionEpoch: current, action: "survival-coop:transfer-deposit", args: [starter-fiber, 3], expect: refused}
  # The retry credits the warehouse; fail the source finalize so the crash lands right after CREDITED.
  - {op: commit_barrier, mode: fail, count: 1, key: "transfer-personal:owner", skip: 4}
  - {op: command, player: owner, requestId: Transfer101, sessionEpoch: current, action: "survival-coop:transfer-deposit", args: [starter-fiber, 3], expect: refused}
  - {op: expect_result, player: owner, field: data.phase, equals: FINALIZE_UNKNOWN}
  - {op: reload}
  - {op: advance_elapsed, seconds: 181}
  - {op: reload}
  - {op: advance_elapsed, seconds: 242}
  - {op: join, player: owner}
  - {op: command, player: owner, requestId: Transfer101, sessionEpoch: current, action: "survival-coop:transfer-deposit", args: [starter-fiber, 3], times: 20}
  - {op: expect_result, player: owner, field: data.phase, equals: FINALIZED}
  - {op: expect_result, player: owner, field: stateVersion, equals: 1}
  - {op: expect_snapshot, player: owner, genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 9}
  - {op: expect_snapshot, player: owner, scope: session, field: "survivalSettlement.warehouse.items.transfer:owner:0:Transfer101:output.quantity", equals: 3}
  # Fail the warehouse escrow write so the withdraw crash lands right after PREPARED.
  - {op: commit_barrier, mode: fail, count: 1, key: transfer-tribe, skip: 3}
  - {op: command, player: owner, requestId: Withdraw101, sessionEpoch: current, action: "survival-coop:transfer-withdraw", args: ["transfer:owner:0:Transfer101:output", 3], expect: refused}
  - {op: expect_result, player: owner, field: data.phase, equals: SOURCE_UNKNOWN}
  - {op: close, player: owner}
  - {op: reload}
  - {op: join, player: owner}
  - {op: recover_transfers, player: owner, maximum: 8}
  - {op: recover_transfers, player: owner, maximum: 8}
  - {op: recover_transfers, player: owner, maximum: 8}
  - {op: command, player: owner, requestId: Withdraw101, sessionEpoch: current, action: "survival-coop:transfer-withdraw", args: ["transfer:owner:0:Transfer101:output", 3], times: 20}
  - {op: expect_result, player: owner, field: data.phase, equals: FINALIZED}
  - {op: expect_result, player: owner, field: stateVersion, at_least: 1}
  - {op: expect_snapshot, player: owner, genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 9}
  - {op: expect_snapshot, player: owner, genre: survival-coop, field: "inventory.bag.items.transfer:owner:0:Transfer101:output.quantity", equals: 3}
  - {op: expect_snapshot, player: owner, scope: session, field: "survivalSettlement.warehouse.items.transfer:owner:0:Transfer101:output", is_nil: true}
  - {op: close, player: owner}
  - {op: expect_members, members: []}
