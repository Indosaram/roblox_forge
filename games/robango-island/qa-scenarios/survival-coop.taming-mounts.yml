# Native taming + mounts through the real Session and the registered TamingExtension.
# Wild animals are supplied by the fixture (ids -> species); every other module is real.
name: taming-mounts
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
timeout_seconds: 120
seed: 4242
players: ["1"]
fixtures: []
data:
  nativeDeath: development-island-v1
  survivalSpatial:
    radiusStuds: 8
    players: {"1": {x: 0, y: 1, z: 0}}
    campfires: {campfire: {x: 6, y: 1, z: 0}}
  durable:
    actions: ["survival-coop:gather", "survival-coop:transfer-deposit", "survival-coop:transfer-withdraw", "survival-coop:settlement-leave", "survival-coop:settlement-kick", "survival-coop:settlement-transfer-owner", "survival-coop:settlement-rejoin", "survival-coop:settlement-reserve", "survival-coop:settlement-place", "survival-coop:settlement-cancel", "survival-coop:settlement-demolish", "survival-coop:settlement-workshop-reserve", "survival-coop:settlement-workshop-start", "survival-coop:settlement-workshop-complete", "survival-coop:settlement-workshop-cancel", "survival-coop:craft-reserve", "survival-coop:craft-start", "survival-coop:craft-complete", "survival-coop:craft-cancel", "survival-coop:food", "survival-coop:rest", "survival-coop:inventory-move", "survival-coop:inventory-split", "survival-coop:inventory-merge", "survival-coop:tame-hit", "survival-coop:tame-capture", "survival-coop:tame-feed", "survival-coop:tame-mount", "survival-coop:tame-dismount"]
    serverActions: ["survival-coop:settlement-invite", "survival-coop:server-vitals-tick", "survival-coop:vitals-damage", "survival-coop:rest-stop", "survival-coop:respawn"]
    tickAction: survival-coop:server-vitals-tick
    personal: {namespace: personal, inventoryPath: [genres, survival-coop, data, inventory, bag]}
  taming:
    wild: {ridge-01: ridge-strider, brute-01: hunter}
    policy: {taming: {successPermille: 1000}}
steps:
  - {op: join, player: "1"}
  - {op: command, player: "1", requestId: reserve, sessionEpoch: current, action: "survival-coop:craft-reserve", args: [capture-bola, hand]}
  - {op: command, player: "1", requestId: start, sessionEpoch: current, action: "survival-coop:craft-start", args: ["w1:1:0:7:reserve"]}
  - {op: advance_to, seconds: 4}
  - {op: command, player: "1", requestId: complete, sessionEpoch: current, action: "survival-coop:craft-complete", args: ["w1:1:0:7:reserve"]}
  - {op: command, player: "1", requestId: hit-brute, sessionEpoch: current, action: "survival-coop:tame-hit", args: [brute-01], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: NOT_TAMEABLE}
  - {op: command, player: "1", requestId: hit-1, sessionEpoch: current, action: "survival-coop:tame-hit", args: [ridge-01]}
  - {op: command, player: "1", requestId: capture-early, sessionEpoch: current, action: "survival-coop:tame-capture", args: [ridge-01], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: GAUGE_NOT_FULL}
  - {op: advance_to, seconds: 5}
  - {op: command, player: "1", requestId: hit-2, sessionEpoch: current, action: "survival-coop:tame-hit", args: [ridge-01]}
  - {op: advance_to, seconds: 6}
  - {op: command, player: "1", requestId: hit-3, sessionEpoch: current, action: "survival-coop:tame-hit", args: [ridge-01]}
  - {op: advance_to, seconds: 7}
  - {op: command, player: "1", requestId: hit-4, sessionEpoch: current, action: "survival-coop:tame-hit", args: [ridge-01]}
  - {op: advance_to, seconds: 8}
  - {op: command, player: "1", requestId: hit-5, sessionEpoch: current, action: "survival-coop:tame-hit", args: [ridge-01]}
  - {op: expect_result, player: "1", field: data.full, equals: true}
  - {op: command, player: "1", requestId: capture-1, sessionEpoch: current, action: "survival-coop:tame-capture", args: [ridge-01]}
  - {op: expect_result, player: "1", field: data.captured, equals: true}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.animals.1.species, equals: ridge-strider}
  - {op: command, player: "1", requestId: mount-early, sessionEpoch: current, action: "survival-coop:tame-mount", args: ["1:1"], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: STILL_IN_PEN}
  - {op: command, player: "1", requestId: feed-1, sessionEpoch: current, action: "survival-coop:tame-feed", args: ["1:1", berry]}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.starter-berry.quantity, equals: 2}
  - {op: command, player: "1", requestId: feed-2, sessionEpoch: current, action: "survival-coop:tame-feed", args: ["1:1", berry]}
  - {op: command, player: "1", requestId: feed-3, sessionEpoch: current, action: "survival-coop:tame-feed", args: ["1:1", berry]}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.animals.1.ready, equals: true}
  - {op: command, player: "1", requestId: feed-4, sessionEpoch: current, action: "survival-coop:tame-feed", args: ["1:1", berry], expect: refused}
  - {op: command, player: "1", requestId: mount-1, sessionEpoch: current, action: "survival-coop:tame-mount", args: ["1:1"]}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.walkSpeedStuds, equals: 28}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.animals.1.species, equals: ridge-strider}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.walkSpeedStuds, equals: 28}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.starter-berry.is_nil, is_nil: true}
  - {op: command, player: "1", requestId: capture-1, sessionEpoch: current, action: "survival-coop:tame-capture", args: [ridge-01], times: 2}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.animals.2, is_nil: true}
  - {op: command, player: "1", requestId: dismount-1, sessionEpoch: current, action: "survival-coop:tame-dismount", args: []}
  - {op: expect_snapshot, player: "1", genre: survival-coop, scope: session, field: survivalExtensions.taming.walkSpeedStuds, is_nil: true}
  - {op: close, player: "1"}
  - {op: expect_members, members: []}
