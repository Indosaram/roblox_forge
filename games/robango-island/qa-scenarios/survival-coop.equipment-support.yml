name: equipment-support
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
seed: 114
timeout_seconds: 120
players: [owner]
fixtures: [cli/forge/fixtures/volcano]
data:
  durable:
    actions: ["survival-coop:equipment-quote"]
    personal: {namespace: personal, inventoryPath: [genres, survival-coop, data, inventory, bag]}
steps:
  - {op: join, player: owner}
  - {op: equipment_support, player: owner}
  - {op: expect_result, player: owner, field: data.level59Refused, equals: true}
  - {op: expect_result, player: owner, field: data.supportTier, equals: 3}
  # p103 g18: the support quote is the authored tier row; acknowledging records the level gate.
  - {op: equipment_quote, player: owner, id: support-tier-1, verb: preview, level: 50}
  - {op: expect_result, player: owner, field: data.level, equals: 60}
  - {op: expect_result, player: owner, field: data.cost, equals: 500}
  - {op: expect_result, player: owner, field: data.levelMet, equals: false}
  - {op: equipment_quote, player: owner, id: modify-hardness, verb: preview, level: 50, expect: refused}
  - {op: expect_result, player: owner, field: reason, equals: UNKNOWN_OPERATION}
  - {op: equipment_quote, player: owner, id: support-tier-1, verb: acknowledge, level: 50}
  - {op: expect_result, player: owner, field: data.acknowledged, equals: 60}
  - {op: close, player: owner}
