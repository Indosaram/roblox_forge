name: route-share
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
seed: 103
timeout_seconds: 120
players: [owner, helper, newcomer]
fixtures: [cli/forge/fixtures/archipelago]
steps:
  - {op: join, player: owner}
  # S7 / guide g12: the owner shares their highest open route with party members.
  - {op: route_share, player: owner, verb: route-invite, target: helper}
  - {op: expect_result, player: owner, field: data.route, equals: 5}
  - {op: route_share, player: owner, verb: route-invite, target: newcomer}
  - {op: route_open, player: helper, route: 5, sharedBy: owner, expect: refused}
  - {op: expect_result, player: helper, field: reason, equals: instability_gate}
  - {op: route_share, player: helper, verb: route-accept, target: owner}
  - {op: expect_result, player: helper, field: data.status, equals: member}
  # Gates stay per member: the level-1 newcomer cannot accept route 5.
  - {op: route_share, player: newcomer, verb: route-accept, target: owner, expect: refused}
  - {op: expect_result, player: newcomer, field: reason, equals: level_gate}
  - {op: route_open, player: helper, route: 5, sharedBy: owner}
  - {op: route_share, player: owner, verb: route-revoke, target: helper}
  - {op: route_share, player: owner, verb: route-revoke, target: helper, expect: refused}
  - {op: expect_result, player: owner, field: reason, equals: invite_missing}
  - {op: route_share, player: helper, verb: route-accept, target: owner, expect: refused}
  - {op: expect_result, player: helper, field: reason, equals: invite_missing}
  - {op: close, player: owner}
