# Client render caps per device profile. Low applies at SavedQualityLevel 1..qualityLevelMax,
# or Automatic on a touch device. High equals the uncapped behaviour. decorFaunaPose: whether
# decorative arrival fauna plays its graze idle (low holds the rest pose). Runtime mirror:
# src/shared/RenderBudget.luau (render-budget.spec.luau asserts equality).
'render_profiles':
  'low':
    'qualityLevelMax': 3
    'decorPartsMax': 160
    'effectsMax': 2
    'decorShadows': false
    'wildlifePoseStuds': 60
    'wildlifePoseMax': 6
    'decorFaunaPose': false
    'meshBuildsMax': 2
    'decorDeferSeconds': 8
  'high':
    'qualityLevelMax': 10
    'decorPartsMax': 100000
    'effectsMax': 100000
    'decorShadows': true
    'wildlifePoseStuds': 100
    'wildlifePoseMax': 1000
    'decorFaunaPose': true
    'meshBuildsMax': 6
    'decorDeferSeconds': 0
