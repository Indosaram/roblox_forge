environments:
  # Ids are `${VAR}` references resolved from the environment at deploy time, so
  # no real experience or place id is committed. Fill them in .env.local (see
  # .env.example).
  staging:
    universeId: ${FORGE_STAGING_UNIVERSE_ID}
    placeId: ${FORGE_STAGING_PLACE_ID}
    # One place per Topology role. New players join the start place, so it is
    # the onboarding role. Open Cloud cannot create places: the owner adds the
    # other places in Creator Hub and records them with
    # `forge deploy roles --env staging --pack robango-island --set <role>=<id>`;
    # `forge deploy --all-roles` then publishes the same build to every place.
    roles:
      onboarding: ${FORGE_STAGING_PLACE_ID}
      home: ${FORGE_STAGING_ROLE_HOME}
      harbor: ${FORGE_STAGING_ROLE_HARBOR}
      archipelago: ${FORGE_STAGING_ROLE_ARCHIPELAGO}
      explore10: ${FORGE_STAGING_ROLE_EXPLORE_TEN}
      explore20: ${FORGE_STAGING_ROLE_EXPLORE_TWENTY}
      frontier30: ${FORGE_STAGING_ROLE_FRONTIER_THIRTY}
      frontier40: ${FORGE_STAGING_ROLE_FRONTIER_FORTY}
      frontier50: ${FORGE_STAGING_ROLE_FRONTIER_FIFTY}
      frontier60: ${FORGE_STAGING_ROLE_FRONTIER_SIXTY}
      brawl: ${FORGE_STAGING_ROLE_BRAWL}
      team-outpost: ${FORGE_STAGING_ROLE_TEAM_OUTPOST}
      town: ${FORGE_STAGING_ROLE_TOWN}
    # Product ids registered on this universe, keyed by game.yml monetization key. deploy
    # injects them as ServerStorage.ForgeMonetizationIds; the server overrides the catalog
    # ids with them. A missing or unset id becomes 0, which the shop lists but never prompts.
    monetization:
      routeGuildPatron: 2040232413
      wideWarehouse: 2037904759
      skinRidgeStriderGold: 3720013569
      routeGuildMonthly: EXP-4461467833720767028
  production:
    universeId: ${FORGE_PRODUCTION_UNIVERSE_ID}
    placeId: ${FORGE_PRODUCTION_PLACE_ID}
    requiresHumanMerge: true
    roles:
      onboarding: ${FORGE_PRODUCTION_PLACE_ID}
      home: ${FORGE_PRODUCTION_ROLE_HOME}
      harbor: ${FORGE_PRODUCTION_ROLE_HARBOR}
      archipelago: ${FORGE_PRODUCTION_ROLE_ARCHIPELAGO}
      explore10: ${FORGE_PRODUCTION_ROLE_EXPLORE_TEN}
      explore20: ${FORGE_PRODUCTION_ROLE_EXPLORE_TWENTY}
      frontier30: ${FORGE_PRODUCTION_ROLE_FRONTIER_THIRTY}
      frontier40: ${FORGE_PRODUCTION_ROLE_FRONTIER_FORTY}
      frontier50: ${FORGE_PRODUCTION_ROLE_FRONTIER_FIFTY}
      frontier60: ${FORGE_PRODUCTION_ROLE_FRONTIER_SIXTY}
      brawl: ${FORGE_PRODUCTION_ROLE_BRAWL}
      team-outpost: ${FORGE_PRODUCTION_ROLE_TEAM_OUTPOST}
      town: ${FORGE_PRODUCTION_ROLE_TOWN}
    monetization:
      routeGuildPatron: ${FORGE_PRODUCTION_PRODUCT_ROUTE_GUILD_PATRON}
      wideWarehouse: ${FORGE_PRODUCTION_PRODUCT_WIDE_WAREHOUSE}
      skinRidgeStriderGold: ${FORGE_PRODUCTION_PRODUCT_SKIN_RIDGE_STRIDER_GOLD}
      routeGuildMonthly: ${FORGE_PRODUCTION_PRODUCT_ROUTE_GUILD_MONTHLY}
