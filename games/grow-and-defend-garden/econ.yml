# Config.luau duplicates these values; Config.spec.luau keeps the two equal.
currencies:
  - id: Coins
    kind: free
    starting: 50

crops:
  - id: carrot
    displayName: Carrot
    growthSeconds: 20
    sellPrice: 10
    defense: 1
  - id: pumpkin
    displayName: Pumpkin
    growthSeconds: 45
    sellPrice: 30
    defense: 3
  - id: starfruit
    displayName: Starfruit
    growthSeconds: 90
    sellPrice: 80
    defense: 7

# Barricade points come from harvesting (pack hook) and are spent as defensePower.
# Wave N fields baseEnemies + (N-1) * growth enemies and each wave is 60 s, so the
# cumulative bill is ~N^2/2. growth = 2 made that curve outrun carrot production at
# wave 8 no matter how well the player played: 120 points owed by wave 10 against ~90
# produced. growth = 1 (a flat +1 enemy per wave) puts the carrot-only wall at wave 14
# and lets a player who upgrades to pumpkin (defense 3) reach wave 20, so the crop
# ladder is the answer to the curve instead of a cosmetic price list.
waves:
  waveInterval: 60
  baseEnemies: 3
  growth: 1
  winReward: 25
