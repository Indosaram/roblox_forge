environments:
  # Ids are `${VAR}` references resolved from the environment at deploy time, so
  # no real experience or place id is committed. See .env.example.
  staging:
    universeId: ${FORGE_STAGING_UNIVERSE_ID}
    placeId: ${FORGE_STAGING_PLACE_ID}
  production:
    universeId: 10775506136
    placeId: 121621988401104
    requiresHumanMerge: true
# Localization Tables API target for `forge locale sync` (0 = unset).
localizationTableId: 0
