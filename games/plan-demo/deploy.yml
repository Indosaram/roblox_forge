    universeId: 10775163735
    placeId: 100097233115465
    monetization:
      coins2x: 2074629611
      vipSlots: 2075673646
      autoLock: 2075529604
      creaturePack: 3729357243
      hatchSpeedup: 3729357250
      siegeShield: 3729357255
      luckBoost: 3729357262
  production:
    universeId: 0
    placeId: 0
    requiresHumanMerge: true
# Localization Tables API target for `forge locale sync` (0 = unset).
localizationTableId: 0
# Launch art uploaded by the G5 publish step; `id` is the A/B variant id.
assets:
