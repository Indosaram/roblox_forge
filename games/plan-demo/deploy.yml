    - id: a
      path: assets/icon/icon-a.png
    - id: b
      path: assets/icon/icon-b.png
  thumbnails:
    - id: a
      path: assets/thumbnails/thumb-a.png
    - id: b
      path: assets/thumbnails/thumb-b.png
