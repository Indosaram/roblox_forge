name: first-purchase
genre: grow-harvest
kind: smoke
steps:
  - action: join
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "schemaVersion") >= 1, "save schema loads")'
    seconds: 2
  - action: purchase_sim
    target: gamepass
    seconds: 3
    expect: 'the deterministic extra-plot gamepass adds a plot, never a random seed'
  - action: purchase_sim
    target: product
    seconds: 3
    expect: 'a deterministic growth speed-up applies to the next timer'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "plots") == ForgeQA:Invoke("get", "basePlots") + 1, "plot slot granted")'
    seconds: 2
  - action: leave
    seconds: 1
