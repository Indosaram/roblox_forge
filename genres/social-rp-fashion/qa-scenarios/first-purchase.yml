name: first-purchase
genre: social-rp-fashion
kind: smoke
steps:
  - action: join
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "schemaVersion") >= 1, "save schema loads")'
    seconds: 2
  - action: purchase_sim
    target: gamepass
    seconds: 3
    expect: 'the deterministic extra-outfit-slot gamepass adds a slot, never a random item'
  - action: purchase_sim
    target: product
    seconds: 3
    expect: 'a deterministic outfit pack is granted'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "outfitSlots") == ForgeQA:Invoke("get", "baseOutfitSlots") + 1, "outfit slot granted")'
    seconds: 2
  - action: leave
    seconds: 1
