name: tutorial
genre: social-rp-fashion
kind: playtest
steps:
  - action: join
    seconds: 5
    expect: 'player spawns in the dressing room'
  - action: capture
    target: wardrobe
    expect: 'wardrobe and outfit slots are visible'
  - action: click
    target: outfit-slot-1
  - action: click
    target: wear-item
    expect: 'the item is worn on the avatar'
  - action: capture
    target: tutorial-complete
    expect: 'the dressed avatar and save button are visible'
