# collect-raid economy template.
#
# Two consumers share this file:
#   * `forge new <slug> --genre collect-raid` copies the top-level economy sections
#     verbatim into a fresh pack (they are intentionally empty, so a new pack starts
#     with the scaffolded starter economy).
#   * `forge plan --genre collect-raid` reads the parametric `plan:` block below and
#     expands it into a concrete games/<pack>/{game.yml,econ.yml,design/}. All
#     collect-raid design knowledge - session shape, siege structure, tutorial,
#     analytics events, ratings, tuning knobs, name pools, price ladder and balance
#     targets - lives here so the planner stays genre-agnostic.

plan:
  currency: Coins
  starting_coins: 100
  incubators: 3
  growth_per_owned: 0.2
  active_slots: 6

  session_target_minutes: 30
  core_loop: "Buy an egg, hatch it in seconds, and let the creature earn Coins at the base; spend those Coins on bigger eggs, merge 3-of-a-kind up a rarity, and join the team siege every 10 minutes to raid the rival vault."
  pillars:
    - "Hatch in under 60 seconds: the first egg pays for itself inside the first minute."
    - "Merge upward: three of a kind fuse into the next rarity, so the roster keeps growing."
    - "Team siege, never personal theft: raids only touch the shared enemy vault."
    - "Everything paid is deterministic: Robux buys fixed items, random hatching is free-currency only."

  siege:
    structure: "Two teams each defend a shared vault. Every siege period a window opens for a fixed duration and squads move up to max_take eggs from the enemy vault. Personal bases are never a raid target."
    period_seconds: 600
    duration_seconds: 120
    max_take: 3

  tutorial_steps:
    - "Buy your first egg from the base shop"
    - "Hold the incubator prompt to hatch it"
    - "Watch the creature produce Coins on the parade slot"
    - "Buy a bigger egg with the Coins you earned"
    - "Merge three of a kind into the next rarity"
    - "Open the store and read the deterministic item labels"

  analytics_events:
    - session_start
    - session_end
    - tutorial_step
    - tutorial_complete
    - egg_purchase
    - egg_hatch
    - kaiju_merge
    - siege_join
    - raid_success
    - quest_claim
    - store_open
    - robux_purchase

  ratings:
    violence: "Mild fantasy only - creatures shove and bump in team sieges; no blood, no gore, no realistic weapons."
    romance: "None."
    gambling: "None. Random hatching uses free currency only and shows the pool odds; every Robux item is deterministic."
    social: "Default Roblox chat only - no custom chat, no user-generated text, no voice, no external links."
    language: "None (English UI strings only)."
    paid_random: false

  art_style: "chunky low-poly toy creatures, saturated team colors (red/blue), neon rarity accents, soft daylight with bloom"
  poly_budget: { kaiju: 3000, egg: 600, prop: 800, world_parts_max: 6000 }

  egg_count: { min: 2, max: 3 }
  egg_base_price: 50
  egg_price_multipliers: [1, 5, 15]
  egg_hatch_seconds: [5, 15, 30]
  egg_weight_profiles:
    - [70, 25, 5]
    - [60, 30, 10]
    - [50, 35, 15]

  rarity_tiers:
    - { name: Common, coins_per_second: 1 }
    - { name: Rare, coins_per_second: 3 }
    - { name: Legendary, coins_per_second: 8 }

  creature_suffixes:
    Common: [Pup, Hatchling, Scamper]
    Rare: [Mauler, Serpent, Stalker]
    Legendary: [Titan, Leviathan, Colossus]

  fallback_nouns: [Kaiju, Vault, Island, Sky, Ember, Tidal]
  # Base hue families an egg's own body color is snapped to (HSV hue degrees).
  # Every egg picks the nearest family so its roster reads as a distinct
  # palette from every other egg, instead of every egg sharing one look.
  egg_hue_families: [18, 210, 140, 280, 45, 320]
  # Rarity raises saturation/brightness/accent intensity on top of the egg's
  # hue family; body/accent/eye all derive from (egg hue x tier style).
  tier_style:
    Common: { saturation: 0.55, brightness: 0.62, accent_boost: 0.12 }
    Rare: { saturation: 0.72, brightness: 0.7, accent_boost: 0.22 }
    Legendary: { saturation: 0.88, brightness: 0.8, accent_boost: 0.35 }
  # Fallback archetype per tier, used only when the creature's name noun (its
  # suffix) doesn't match any keyword below.
  archetypes:
    Common: quad
    Rare: quad
    Legendary: titan
  # Name noun -> archetype. Checked against the lower-cased creature suffix
  # before falling back to `archetypes` above, so "Serpent"/"Leviathan" render
  # as the serpent archetype even in the Legendary tier, etc.
  archetype_keywords:
    serpent: serpent
    snake: serpent
    eel: serpent
    leviathan: serpent
    wyrm: serpent
    titan: titan
    colossus: titan
    golem: titan
    pup: quad
    hatchling: quad
    scamper: quad
    runner: quad
    stalker: quad
    mauler: biped
    brute: biped
  scales:
    Common: 1
    Rare: 1.4
    Legendary: 2

  merges:
    - { from: Common, count: 3, to: Rare }
    - { from: Rare, count: 3, to: Legendary }

  daily_quests:
    - { id: hatch, text: "Hatch 3 eggs", reward: 100 }
    - { id: buy, text: "Buy 5 eggs", reward: 150 }
    - { id: raid, text: "Join 1 siege", reward: 300 }

  monetization:
    price_ladder:
      low: 99
      mid: 199
      high: 499
      premium: 699
    gamepasses:
      - { key: coins2x, name: "2x Coins", tier: premium, effect: "Doubles coin income.", multiplier: 2 }
      - { key: vipSlots, name: "VIP Slots +4", tier: premium, effect: "Adds four incubator slots.", slotBonus: 4 }
      - { key: autoLock, name: "Auto Lock", tier: mid, effect: "Auto-locks your creatures before a siege." }
    products:
      - { key: creaturePack, name: "Guaranteed Rare Creature Pack", tier: low, effect: "Grants one fixed Rare creature." }
      - { key: hatchSpeedup, name: "Hatch Speed-Up", tier: premium, effect: "Instantly finishes the current hatch." }
      - { key: siegeShield, name: "Siege Shield", tier: low, effect: "Protects your team vault from raids for 10 minutes while you remain in the server." }
      - { key: luckBoost, name: "Server Luck Boost 15m", tier: mid, effect: "Improves free-hatch odds for the server for 15 minutes." }

  fairness_rules:
    - "Every Robux item is deterministic: the label names exactly what is granted."
    - "Random hatching runs only on free currency; no Robux ever opens a random roll."
    - "The luck boost only shifts free-hatch odds and never sells a random item."
    - "A team siege only moves free-produced Common value; paid creatures are never stolen."

  store_tags: [Collect, Simulation, Team, Strategy, Idle, Fantasy]

  first_purchase_target_minutes: [10, 30]
  day7_growth_max_percent: 25
  egg_sink_min_percent: 5

# The scaffold/economy sections consumed by `forge new` and codegen. Left empty so a
# fresh `forge new` pack starts from the playable starter economy. `forge plan`
# synthesizes the full economy from the `plan:` block above.
currencies: []
sources: []
sinks: []
