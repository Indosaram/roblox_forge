name: command-replay
genre: survival-coop
pack: fixture-survival
kind: native
contract_api: 1
timeout_seconds: 120
players: ["1"]
fixtures: []
data:
  durable:
    actions: ["survival-coop:buy-defense", "survival-coop:defend-active"]
    windowSeconds: 1000
    maxOutcomes: 8
steps:
  - {op: join, player: "1"}
  - {op: advance_to, seconds: 999}
  - {op: commit_barrier, mode: fail}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: COMMIT_FAILED}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 100}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: upgradeLevel, equals: 0}
  - {op: commit_barrier, mode: suspend}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", expect_suspended: true}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: COMMAND_PENDING}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 100}
  - {op: resume_commit}
  - {op: expect_result, player: "1", field: stateVersion, equals: 1}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", times: 100}
  - {op: expect_result, player: "1", field: stateVersion, equals: 1}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 90}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: upgradeLevel, equals: 1}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:defend-active", expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: REQUEST_CONFLICT}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", times: 100}
  - {op: expect_result, player: "1", field: stateVersion, equals: 1}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 90}
  - {op: advance_to, seconds: 1000}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", times: 100}
  - {op: expect_result, player: "1", field: stateVersion, equals: 1}
  - {op: command, player: "1", requestId: unknown, sessionEpoch: 0, action: "survival-coop:buy-defense", expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: REQUEST_EXPIRED}
  - {op: advance_to, seconds: 1999}
  - {op: command, player: "1", requestId: purchase, sessionEpoch: 0, action: "survival-coop:buy-defense", expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: REQUEST_EXPIRED}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 90}
  - {op: close, player: "1"}
  - {op: expect_members, members: []}
