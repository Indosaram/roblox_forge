# Production universe book and Session personal fences: escrow, quoted bundle purchase,
# explicit collection, request replay, refusal conservation, and restart cancellation.
name: market-trade
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
timeout_seconds: 120
players: ["1", "2", "3", "4"]
fixtures: [cli/forge/fixtures/market-extension]
data:
  durable:
    actions: ["survival-coop:market-list", "survival-coop:market-buy", "survival-coop:market-cancel", "survival-coop:market-claim", "survival-coop:market-browse"]
    personal: {namespace: personal, inventoryPath: [genres, survival-coop, data, inventory, bag]}
steps:
  - {op: join, player: "1"}
  - {op: join, player: "2"}
  - {op: join, player: "3"}
  - {op: join, player: "4"}
  - {op: expect_snapshot, player: "3", scope: session, field: survivalExtensions.market.ineligibleReason, equals: INELIGIBLE_TUTORIAL}
  - {op: command, player: "3", requestId: ineligible, sessionEpoch: current, action: "survival-coop:market-list", args: [starter-fiber, 1, 10], expect: refused}
  - {op: expect_result, player: "3", field: reason, equals: INELIGIBLE_TUTORIAL}
  - {op: expect_snapshot, player: "3", genre: survival-coop, field: balance, equals: 50}
  - {op: expect_snapshot, player: "3", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 12}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 100}
  - {op: command, player: "1", requestId: list1, sessionEpoch: current, action: "survival-coop:market-list", args: [starter-fiber, 4, 100]}
  - {op: expect_result, player: "1", field: data.fee, equals: 5}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 8}
  - {op: command, player: "2", requestId: browse, sessionEpoch: current, action: "survival-coop:market-browse", args: [fiber, 1]}
  - {op: expect_snapshot, player: "2", scope: session, field: survivalExtensions.market.listings.1.price, equals: 100}
  - {op: command, player: "1", requestId: self, sessionEpoch: current, action: "survival-coop:market-buy", args: ["1:list1", 100], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: listing_unavailable}
  - {op: command, player: "4", requestId: broke, sessionEpoch: current, action: "survival-coop:market-buy", args: ["1:list1", 100], expect: refused}
  - {op: expect_result, player: "4", field: reason, equals: insufficient_funds}
  - {op: expect_snapshot, player: "4", genre: survival-coop, field: balance, equals: 0}
  - {op: expect_snapshot, player: "4", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 12}
  - {op: command, player: "2", requestId: buy1, sessionEpoch: current, action: "survival-coop:market-buy", args: ["1:list1", 100]}
  - {op: expect_result, player: "2", field: data.price, equals: 100}
  - {op: expect_snapshot, player: "2", genre: survival-coop, field: balance, equals: 50}
  - {op: expect_snapshot, player: "2", scope: session, field: survivalExtensions.market.claims.1.value.item.quantity, equals: 4}
  - {op: expect_snapshot, player: "1", scope: session, field: survivalExtensions.market.claims.1.value.coins, equals: 95}
  - {op: command, player: "2", requestId: collect-buy, sessionEpoch: current, action: "survival-coop:market-claim", args: ["2:buy1:0"]}
  - {op: command, player: "1", requestId: collect-sale, sessionEpoch: current, action: "survival-coop:market-claim", args: ["2:buy1:1"]}
  - {op: expect_snapshot, player: "2", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 16}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 195}
  - {op: command, player: "2", requestId: buy1, sessionEpoch: current, action: "survival-coop:market-buy", args: ["1:list1", 100]}
  - {op: expect_result, player: "2", field: data.price, equals: 100}
  - {op: expect_snapshot, player: "2", genre: survival-coop, field: balance, equals: 50}
  - {op: expect_snapshot, player: "2", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 16}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 195}
  - {op: command, player: "2", requestId: again, sessionEpoch: current, action: "survival-coop:market-buy", args: ["1:list1", 100], expect: refused}
  - {op: expect_result, player: "2", field: reason, equals: listing_unavailable}
  - {op: command, player: "1", requestId: list2, sessionEpoch: current, action: "survival-coop:market-list", args: [starter-fiber, 2, 40]}
  - {op: expect_result, player: "1", field: data.fee, equals: 2}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 6}
  - {op: close, player: "1"}
  - {op: close, player: "2"}
  - {op: close, player: "3"}
  - {op: close, player: "4"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: join, player: "2"}
  - {op: expect_snapshot, player: "1", scope: session, field: survivalExtensions.market.listed.1.id, equals: "1:list2"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 195}
  - {op: command, player: "1", requestId: cancel2, sessionEpoch: current, action: "survival-coop:market-cancel", args: ["1:list2"]}
  - {op: expect_result, player: "1", field: data.quantity, equals: 2}
  - {op: command, player: "1", requestId: collect-return, sessionEpoch: current, action: "survival-coop:market-claim", args: ["1:list2:return:0"]}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.starter-fiber.quantity, equals: 8}
  - {op: expect_snapshot, player: "1", scope: session, field: survivalExtensions.market.listed.1, is_nil: true}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: balance, equals: 195}
  - {op: close, player: "1"}
  - {op: close, player: "2"}
  - {op: expect_members, members: []}
