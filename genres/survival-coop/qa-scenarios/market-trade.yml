# Native player market: list, buy, refusals and the durable per-actor ledger over a real Session.
name: market-trade
genre: survival-coop
pack: robango-island
kind: native
contract_api: 1
timeout_seconds: 120
players: ["1", "2", "3"]
fixtures: [cli/forge/fixtures/market-extension]
data:
  durable:
    actions: ["survival-coop:market-list", "survival-coop:market-buy"]
steps:
  - {op: join, player: "1"}
  - {op: join, player: "2"}
  - {op: join, player: "3"}
  - {op: command, player: "1", requestId: list1, sessionEpoch: current, action: "survival-coop:market-list", args: [wood, 4, 25]}
  - {op: expect_result, player: "1", field: data.fee, equals: 5}
  - {op: expect_snapshot, player: "2", scope: session, field: survivalExtensions.market.catalogs.1.listings.1.unitPrice, equals: 25}
  - {op: command, player: "3", requestId: ineligible, sessionEpoch: current, action: "survival-coop:market-list", args: [wood, 1, 10], expect: refused}
  - {op: expect_result, player: "3", field: reason, equals: INELIGIBLE_TUTORIAL}
  - {op: command, player: "1", requestId: self, sessionEpoch: current, action: "survival-coop:market-buy", args: ["mk:1:1"], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: SELF_TRADE}
  - {op: command, player: "2", requestId: buy1, sessionEpoch: current, action: "survival-coop:market-buy", args: ["mk:1:1"]}
  - {op: expect_result, player: "2", field: data.price, equals: 100}
  - {op: expect_snapshot, player: "2", scope: session, field: survivalExtensions.market.bought.mk:1:1.price, equals: 100}
  - {op: expect_snapshot, player: "1", scope: session, field: survivalExtensions.market.listed.mk:1:1.status, equals: sold}
  - {op: command, player: "2", requestId: again, sessionEpoch: current, action: "survival-coop:market-buy", args: ["mk:1:1"], expect: refused}
  - {op: expect_result, player: "2", field: reason, equals: LISTING_UNAVAILABLE}
  - {op: close, player: "1"}
  - {op: close, player: "2"}
  - {op: close, player: "3"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", scope: session, field: survivalExtensions.market.listed.mk:1:1.status, equals: sold}
  - {op: close, player: "1"}
  - {op: expect_members, members: []}
