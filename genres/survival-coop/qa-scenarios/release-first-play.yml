# AUTHORED_PARTIAL: real-input probe, not release approval or unprompted discovery.
# Requires fresh persistent profiles/nodes and the Task 9 provisioned two-actor pack.
# All timings/actors/results must come from the driver; no firstPlay supplement is seeded.
# Blocked-path recovery and simultaneous contention require shared observation/input contracts.
name: release-first-play
genre: survival-coop
pack: primal-isles
kind: studio
contract_api: 1
timeout_seconds: 1200
players: [owner, guest]
steps:
