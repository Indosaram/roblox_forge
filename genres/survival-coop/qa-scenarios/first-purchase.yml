name: first-purchase
genre: survival-coop
kind: smoke
steps:
  - action: join
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "schemaVersion") >= 1, "save schema loads")'
    seconds: 2
  - action: purchase_sim
    target: gamepass
    seconds: 3
    expect: 'the deterministic extra-loadout gamepass adds gear, never a random drop'
  - action: purchase_sim
    target: product
    seconds: 3
    expect: 'a deterministic camp repair is applied'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "loadoutSlots") == ForgeQA:Invoke("get", "baseLoadoutSlots") + 1, "loadout slot granted")'
    seconds: 2
  - action: leave
    seconds: 1
