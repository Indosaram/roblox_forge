name: rejoin
genre: survival-coop
kind: smoke
steps:
  - action: join
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; ForgeQA:Invoke("seed", { day = 3, floor = 2, resources = 12 })'
    seconds: 2
    expect: 'a co-op run is saved with a day and floor'
  - action: leave
    seconds: 1
  - action: rejoin
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; local r = ForgeQA:Invoke("run"); assert(r.day == 3 and r.floor == 2, "run persisted")'
    seconds: 2
    expect: 'day, floor, and resources restore and the wave scheduler resumes'
