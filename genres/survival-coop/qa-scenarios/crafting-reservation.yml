name: crafting-reservation
genre: survival-coop
pack: fixture-survival
kind: native
contract_api: 1
timeout_seconds: 120
players: ["1"]
fixtures: []
data:
  durable:
    actions: ["survival-coop:craft-reserve", "survival-coop:craft-start", "survival-coop:craft-complete", "survival-coop:craft-cancel", "survival-coop:inventory-move"]
    windowSeconds: 10000
    maxOutcomes: 256
steps:
  - {op: join, player: "1"}
  - {op: commit_barrier, mode: fail}
  - {op: command, player: "1", requestId: reserve, sessionEpoch: 0, action: "survival-coop:craft-reserve", args: [cord, hand], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: COMMIT_FAILED}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.version, equals: 2}
  - {op: command, player: "1", requestId: reserve, sessionEpoch: 0, action: "survival-coop:craft-reserve", args: [cord, hand], times: 100}
  - {op: expect_result, player: "1", field: data.jobId, equals: "w1:1:0:7:reserve"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "inventory.bag.reservations.w1:1:0:7:reserve.fiber-stack", equals: 3}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.version, equals: 3}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "workshop.entries.w1:1:0:7:reserve.job.state", equals: Reserved}
  - {op: command, player: "1", requestId: start, sessionEpoch: 0, action: "survival-coop:craft-start", args: ["w1:1:0:7:reserve"]}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "workshop.entries.w1:1:0:7:reserve.job.state", equals: Running}
  - {op: advance_to, seconds: 1}
  - {op: command, player: "1", requestId: full, sessionEpoch: 0, action: "survival-coop:craft-complete", args: ["w1:1:0:7:reserve"], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: FULL_SLOTS}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "workshop.entries.w1:1:0:7:reserve.job.state", equals: Ready}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.fiber-stack.quantity, equals: 300}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "workshop.entries.w1:1:0:7:reserve.job.state", equals: Ready}
  - {op: command, player: "1", requestId: free, sessionEpoch: 0, action: "survival-coop:inventory-move", args: [bag, chest, blocker, 1, blocker, 3, 0]}
  - {op: command, player: "1", requestId: finish, sessionEpoch: 0, action: "survival-coop:craft-complete", args: ["w1:1:0:7:reserve"], times: 100}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.fiber-stack.quantity, equals: 297}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "inventory.bag.items.w1:1:0:7:reserve:output:1.quantity", equals: 1}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: command, player: "1", requestId: finish, sessionEpoch: 0, action: "survival-coop:craft-complete", args: ["w1:1:0:7:reserve"], times: 100}
  - {op: command, player: "1", requestId: duplicate, sessionEpoch: 0, action: "survival-coop:craft-complete", args: ["w1:1:0:7:reserve"], expect: refused}
  - {op: expect_result, player: "1", field: reason, equals: ALREADY_COMMITTED}
  - {op: command, player: "1", requestId: reserve2, sessionEpoch: 0, action: "survival-coop:craft-reserve", args: [cord, hand]}
  - {op: command, player: "1", requestId: cancel, sessionEpoch: 0, action: "survival-coop:craft-cancel", args: ["w1:1:0:8:reserve2"]}
  - {op: close, player: "1"}
  - {op: reload}
  - {op: join, player: "1"}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: "workshop.entries.w1:1:0:8:reserve2.job.state", equals: Cancelled}
  - {op: expect_snapshot, player: "1", genre: survival-coop, field: inventory.bag.items.fiber-stack.quantity, equals: 297}
  - {op: close, player: "1"}
  - {op: expect_members, members: []}
