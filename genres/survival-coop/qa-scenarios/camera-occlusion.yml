name: camera-occlusion
genre: survival-coop
pack: primal-isles
kind: studio
contract_api: 1
timeout_seconds: 240
players: [owner, guest]
steps:
  - {op: join, player: owner}
  - {op: join, player: guest}
  - {op: device, player: owner, surface: desktop, width: 1280, height: 720, timeout_seconds: 15}
  - {op: device, player: guest, surface: mobile, width: 390, height: 844, timeout_seconds: 15}
  - {op: expect_members, members: [owner, guest]}
  - {op: capture, target: both-clients-before-roof, angles: 3}
  - {op: walk_to, player: owner, target: Workspace.DevelopmentIsland.CameraTestRoof, withinStuds: 3, timeout_seconds: 45}
  - {op: wait_for, player: owner, timeout_seconds: 10, predicate: {source: property, target: Workspace.DevelopmentIsland.CameraTestRoof, field: LocalTransparencyModifier, at_least: 0.7}}
  - {op: wait_for, player: guest, timeout_seconds: 10, predicate: {source: property, target: Workspace.DevelopmentIsland.CameraTestRoof, field: LocalTransparencyModifier, equals: 0}}
  - {op: keyboard, player: owner, key: I, timeout_seconds: 5, untilState: {source: property, target: Players.LocalPlayer.PlayerGui.ForgeSurvivalHUD.SafeArea.SurvivalSheet, field: Visible, equals: true}}
  - {op: capture, target: local-roof-fade-visible-avatar-and-inventory-two-clients}
  - {op: keyboard, player: owner, key: I, timeout_seconds: 5}
  - {op: walk_to, player: owner, target: Workspace.DevelopmentIsland.workbench, withinStuds: 5, timeout_seconds: 45}
  - {op: wait_for, player: owner, timeout_seconds: 10, predicate: {source: property, target: Workspace.DevelopmentIsland.CameraTestRoof, field: LocalTransparencyModifier, equals: 0}}
  - {op: capture, target: roof-exit-restores-local-opacity, angles: 3}
