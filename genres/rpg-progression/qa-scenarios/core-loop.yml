name: core-loop
genre: rpg-progression
kind: playtest
steps:
  - action: join
    seconds: 5
  - action: click
    target: attack-enemy
    expect: 'combat damages the enemy and grants xp'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "xp") > 0, "combat granted xp")'
  - action: click
    target: level-up
    expect: 'enough xp raises the level'
  - action: click
    target: unlock-ability
    expect: 'the level unlocks a new ability'
  - action: click
    target: travel-region
    expect: 'the level gate opens the next region'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "region") == "region-2", "region unlocked")'
  - action: capture
    target: core-loop
    expect: 'level, ability, and new region all render'
