name: first-purchase
genre: rpg-progression
kind: smoke
steps:
  - action: join
    seconds: 5
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "schemaVersion") >= 1, "save schema loads")'
    seconds: 2
  - action: purchase_sim
    target: gamepass
    seconds: 3
    expect: 'the deterministic xp-boost gamepass applies, never a random drop'
  - action: purchase_sim
    target: product
    seconds: 3
    expect: 'a deterministic ability unlock is granted'
  - action: execute_luau
    code: 'local ForgeQA = game.ServerStorage.ForgeQA; assert(ForgeQA:Invoke("get", "xpMultiplier") == 2, "xp boost applied")'
    seconds: 2
  - action: leave
    seconds: 1
